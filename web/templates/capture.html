{{define "capture"}}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Take photo · miner</title>
  <script src="/static/htmx.min.js"></script>
  <script>
    htmx.config.responseHandling = [
      {code: "204", swap: false},
      {code: "[23]..", swap: true},
      {code: "[45]..", swap: true, error: true},
      {code: "...", swap: false}
    ];
  </script>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #fff; }
    .stage {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
    }
    .topbar {
      position: relative; z-index: 5;
      display: flex; align-items: center;
      padding: max(0.5rem, env(safe-area-inset-top)) 0.75rem 0.5rem;
      min-height: 2.75rem;
      background: linear-gradient(to bottom, #000c, transparent);
    }
    .back {
      appearance: none; border: 0; background: #0008; color: #fff;
      font-size: 1.05rem; font-weight: 600; padding: 0.55rem 0.85rem;
      border-radius: 0.5rem; cursor: pointer;
    }
    .viewport {
      flex: 1; position: relative; min-height: 0;
      background: #111;
    }
    /* contain: keep aspect so % boxes align with image pixels (not cover-crop). */
    .viewport video,
    .viewport img.freeze-img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      background: #000;
    }
    .viewport video[hidden],
    .viewport img.freeze-img[hidden] { display: none !important; }
    .boxes {
      position: absolute; inset: 0; z-index: 2;
      pointer-events: none;
    }
    .boxes button {
      pointer-events: auto;
      position: absolute;
      min-width: 44px; min-height: 44px;
      margin: 0; padding: 0;
      border: 2px solid #62a0ea; border-radius: 0.25rem;
      background: #1a5fb455; color: transparent;
      cursor: pointer;
      box-sizing: border-box;
    }
    .boxes button:active { background: #1a5fb488; }
    .chips {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 3;
      max-height: 40%; overflow: auto; -webkit-overflow-scrolling: touch;
      padding: 0.5rem 0.75rem max(0.5rem, env(safe-area-inset-bottom));
      background: linear-gradient(to top, #000e, #000a 70%, transparent);
      display: none; flex-direction: column; gap: 0.4rem;
    }
    .chips.show { display: flex; }
    .chips button {
      text-align: left; width: 100%;
      font-size: 1rem; font-weight: 500; padding: 0.75rem 0.85rem;
      border-radius: 0.5rem; border: 1px solid #8886;
      background: #222e; color: #fff; cursor: pointer;
      word-break: break-word;
    }
    .shutter-wrap {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 4;
      display: flex; justify-content: center;
      padding: 0 1rem max(1.25rem, env(safe-area-inset-bottom));
      pointer-events: none;
    }
    .shutter-wrap[hidden] { display: none !important; }
    .shutter {
      pointer-events: auto;
      width: 4.5rem; height: 4.5rem; border-radius: 50%;
      border: 4px solid #fff; background: #fffb;
      cursor: pointer; padding: 0;
    }
    .shutter:disabled { opacity: 0.45; cursor: not-allowed; }
    .shutter:active:not(:disabled) { background: #fff8; }
    .banner {
      position: absolute; left: 0.75rem; right: 0.75rem; top: 3.5rem; z-index: 6;
      padding: 0.75rem 0.9rem; border-radius: 0.5rem;
      background: #c01c28cc; font-weight: 600; font-size: 1rem;
    }
    .banner[hidden] { display: none !important; }
    .status {
      position: absolute; left: 50%; top: 50%; z-index: 6;
      transform: translate(-50%, -50%);
      padding: 0.85rem 1.1rem; border-radius: 0.5rem;
      background: #000b; font-weight: 600; font-size: 1.05rem;
      white-space: nowrap;
    }
    .status[hidden] { display: none !important; }
    /* Detail mode: full page scroll allowed only here */
    .detail {
      position: fixed; inset: 0; z-index: 10;
      background: canvas; color: CanvasText;
      overflow: auto; -webkit-overflow-scrolling: touch;
      display: none; flex-direction: column;
    }
    .detail.show { display: flex; }
    .detail .topbar {
      position: sticky; top: 0; background: canvas;
      border-bottom: 1px solid #8883;
    }
    .detail .back { background: transparent; color: inherit; border: 1px solid #8886; }
    .detail-body {
      padding: 1rem; padding-bottom: max(1rem, env(safe-area-inset-bottom));
      max-width: 32rem; margin-inline: auto; width: 100%; box-sizing: border-box;
    }
    .error {
      background: #c01c2840; padding: 0.85rem 0.9rem; border-radius: 0.5rem;
      margin: 0.75rem 0; font-size: 1.05rem; font-weight: 600;
      border-left: 4px solid #c01c28;
    }
    .feedback {
      padding: 0.9rem 1rem; border-radius: 0.5rem; margin: 0.5rem 0;
      font-size: 1.1rem; font-weight: 700; line-height: 1.35;
      border-left: 4px solid transparent;
    }
    .feedback-ok { background: #26a26955; border-left-color: #26a269; }
    .feedback-dup { background: #e5a50a55; border-left-color: #e5a50a; }
    .furigana {
      font-size: 1.25rem; line-height: 2.1; margin: 0.75rem 0;
      word-break: break-word;
    }
    ruby { ruby-position: over; }
    rt { font-size: 0.55em; }
    .content-list { list-style: none; padding: 0; margin: 0.5rem 0 0; }
    .content-list li {
      border-bottom: 1px solid #8883;
      font-size: 1.1rem; min-height: 2.75rem;
    }
    .content-word-btn {
      display: flex; justify-content: space-between; gap: 0.75rem; align-items: center;
      width: 100%; background: transparent; color: inherit; border: 0; border-radius: 0;
      padding: 0.85rem 0.75rem; font-weight: 500; text-align: left; font-size: 1.1rem;
      cursor: pointer;
    }
    .content-word-btn:active { opacity: 0.85; }
    .content-list .reading { opacity: 0.75; font-size: 0.95rem; }
    .muted { opacity: 0.75; font-size: 0.95rem; }
    h2 { font-size: 1.05rem; margin: 1.25rem 0 0.5rem; }
  </style>
</head>
<body>
<div class="stage" data-testid="capture-page">
  <div class="topbar">
    <button type="button" class="back" data-testid="capture-back" aria-label="Back">← Back</button>
  </div>
  <div class="viewport" data-testid="capture-viewport">
    <video data-testid="camera-video" autoplay playsinline muted></video>
    <canvas data-testid="camera-canvas" hidden></canvas>
    <img class="freeze-img" data-testid="freeze-image" alt="" hidden>
    <div class="boxes" data-testid="sentence-boxes" hidden></div>
    <div class="chips" data-testid="sentence-chips"></div>
    <p class="banner" data-testid="camera-error" hidden role="alert"></p>
    <p class="status" data-testid="capture-status" hidden>Reading page…</p>
    <div class="shutter-wrap" data-testid="shutter-wrap">
      <button type="button" class="shutter" data-testid="camera-shutter" aria-label="Capture page"></button>
    </div>
  </div>
</div>

<div class="detail" data-testid="sentence-detail" hidden>
  <div class="topbar">
    <button type="button" class="back" data-testid="detail-back" aria-label="Back to photo">← Back</button>
  </div>
  <div class="detail-body">
    <div id="analyze-result" data-testid="analyze-result"></div>
  </div>
</div>

<script src="/static/camera.js"></script>
</body>
</html>{{end}}
