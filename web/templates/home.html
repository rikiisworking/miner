{{define "home"}}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>miner</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    html, body {
      margin: 0; height: 100%; overflow: hidden;
    }
    body {
      display: flex; flex-direction: column; justify-content: center;
      padding: 1.25rem; padding-bottom: max(1.25rem, env(safe-area-inset-bottom));
      max-width: 28rem; margin-inline: auto; box-sizing: border-box;
      line-height: 1.4;
    }
    h1 { font-size: 1.5rem; margin: 0 0 1.5rem; text-align: center; }
    .actions { display: grid; gap: 0.85rem; }
    a.btn {
      display: block; width: 100%; box-sizing: border-box;
      font-size: 1.2rem; padding: 1.1rem 1rem; border-radius: 0.65rem;
      border: 0; font-weight: 700; text-align: center; text-decoration: none;
      cursor: pointer;
    }
    a.btn-primary { background: #1a5fb4; color: #fff; }
    a.btn-secondary {
      background: transparent; color: inherit; border: 1px solid #8886;
    }
    a.btn:active { opacity: 0.9; }
  </style>
</head>
<body>
<main data-testid="app-home">
  <h1>miner</h1>
  <div class="actions">
    <a class="btn btn-primary" href="/capture" data-testid="take-photo">Take photo</a>
    <a class="btn btn-secondary" href="/queue" data-testid="nav-queue">Queue</a>
  </div>
</main>
</body>
</html>{{end}}
