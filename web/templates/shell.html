{{define "shell"}}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Home · miner</title>
  <script src="/static/htmx.min.js"></script>
  <script>
    // Swap 4xx partials into the target so analyze errors show in-page (not silent no-op).
    htmx.config.responseHandling = [
      {code: "204", swap: false},
      {code: "[23]..", swap: true},
      {code: "[45]..", swap: true, error: true},
      {code: "...", swap: false}
    ];
  </script>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 1rem; max-width: 32rem; margin-inline: auto; line-height: 1.4; }
    h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
    h2 { font-size: 1.05rem; margin: 1.25rem 0 0.5rem; }
    .muted { opacity: 0.75; font-size: 0.95rem; }
    nav { margin-bottom: 1rem; display: flex; gap: 1rem; }
    nav a { color: inherit; font-weight: 600; }
    label { display: block; font-weight: 600; margin-bottom: 0.35rem; }
    textarea {
      width: 100%; box-sizing: border-box; font-size: 1.1rem; padding: 0.75rem;
      border-radius: 0.5rem; border: 1px solid #8884; margin-bottom: 0.75rem;
      min-height: 5rem; resize: vertical; font-family: inherit;
    }
    button, .content-word-btn {
      display: inline-block; width: 100%; font-size: 1.1rem; padding: 0.85rem 1rem;
      border-radius: 0.5rem; border: 0; background: #1a5fb4; color: #fff; font-weight: 600;
      cursor: pointer;
    }
    button:active, .content-word-btn:active { opacity: 0.9; }
    .content-word-btn {
      display: flex; justify-content: space-between; gap: 0.75rem; align-items: center;
      background: transparent; color: inherit; border: 0; border-radius: 0;
      padding: 0.85rem 0.75rem; font-weight: 500; text-align: left;
    }
    .error {
      background: #c01c2840; padding: 0.75rem; border-radius: 0.5rem; margin: 0.75rem 0;
    }
    .feedback {
      padding: 0.75rem; border-radius: 0.5rem; margin: 0.5rem 0;
      font-weight: 600;
    }
    .feedback-ok { background: #26a26940; }
    .feedback-dup { background: #e5a50a40; }
    .furigana {
      font-size: 1.25rem; line-height: 2.1; margin: 0.75rem 0;
      word-break: break-word;
    }
    ruby { ruby-position: over; }
    rt { font-size: 0.55em; }
    .content-list {
      list-style: none; padding: 0; margin: 0.5rem 0 0;
    }
    .content-list li {
      border-bottom: 1px solid #8883;
      font-size: 1.1rem; min-height: 2.75rem;
    }
    .content-list .reading { opacity: 0.75; font-size: 0.95rem; }
    .candidate-list {
      list-style: none; padding: 0; margin: 0.5rem 0 0;
    }
    .candidate-list li {
      border-bottom: 1px solid #8883;
    }
    .candidate-btn {
      display: block; width: 100%; text-align: left;
      background: transparent; color: inherit; border: 0; border-radius: 0;
      padding: 0.85rem 0.75rem; font-size: 1.05rem; font-weight: 500;
      cursor: pointer; word-break: break-word;
    }
    .candidate-btn:active { opacity: 0.85; background: #8882; }
  </style>
</head>
<body>
<main class="shell" data-testid="app-shell">
  <nav>
    <a href="/home" data-testid="nav-home" aria-current="page">Mine</a>
    <a href="/queue" data-testid="nav-queue">Queue</a>
  </nav>
  <h1>miner</h1>
  <p class="muted" data-testid="shell-ready">Unlocked. Paste a page or a sentence to mine.</p>

  <section data-testid="page-text-section" aria-labelledby="page-text-heading">
    <h2 id="page-text-heading">Page text</h2>
    <p class="muted">Paste multi-sentence page text, then pick one sentence.</p>
    <form method="post" action="/page-text"
          hx-post="/page-text"
          hx-target="#sentence-candidates"
          hx-swap="innerHTML"
          data-testid="page-text-form">
      <label for="page_text">Japanese page text</label>
      <textarea id="page_text" name="page_text" lang="ja"
                data-testid="page-text-input"
                placeholder="Paste a full page or several sentences…"
                rows="5"></textarea>
      <button type="submit" data-testid="page-text-submit">Propose sentences</button>
    </form>
    <div id="sentence-candidates" data-testid="sentence-candidates-slot"></div>
  </section>

  <section data-testid="analyze-section" aria-labelledby="analyze-heading">
    <h2 id="analyze-heading">Working sentence</h2>
    <form method="post" action="/analyze"
          hx-post="/analyze"
          hx-target="#analyze-result"
          hx-swap="innerHTML"
          data-testid="analyze-form">
      <label for="sentence">Japanese sentence</label>
      <textarea id="sentence" name="sentence" lang="ja"
                data-testid="sentence-input"
                placeholder="Paste, type, or pick a candidate…"
                required></textarea>
      <button type="submit" data-testid="analyze-submit">Analyze</button>
    </form>
    <div id="analyze-result" data-testid="analyze-result"></div>
  </section>
</main>
</body>
</html>{{end}}
